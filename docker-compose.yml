services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking_password
      POSTGRES_DB: tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://tracking:tracking_password@postgres:5432/tracking?schema=public
      LEGACY_WEBHOOK_API_KEY: local-development-key-change-me
      DRIVER_JWT_SECRET: local-driver-jwt-secret-change-me-at-least-32-chars
      DRIVER_JWT_TTL: 15m
      DRIVER_REFRESH_TTL_DAYS: 30
      DRIVER_LOGIN_MAX_FAILURES: 5
      DRIVER_LOGIN_LOCK_MINUTES: 15
      CORS_ORIGIN: http://localhost:3001
      TRACKING_WEB_BASE_URL: http://localhost:3001
      TRACKING_TOKEN_TTL_DAYS: 30
      POD_MAX_FILE_SIZE_BYTES: 5242880
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://tracking:tracking_password@postgres:5432/tracking?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  tracking-web:
    build:
      context: .
      dockerfile: tracking-web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      TRACKING_API_BASE_URL: http://api:3000
      DATABASE_URL: postgresql://tracking:tracking_password@postgres:5432/tracking?schema=public
      AUTH_SECRET: local-compose-auth-secret-change-me-at-least-32-chars
      OCI_S3_ENDPOINT: https://objectstorage.local
      OCI_S3_BUCKET: delivery-pod
      OCI_S3_ACCESS_KEY: local-compose-access-key
      OCI_S3_SECRET_KEY: local-compose-secret-key
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: OMS <no-reply@example.com>
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  postgres_data:
  
